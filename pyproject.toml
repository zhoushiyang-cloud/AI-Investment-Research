[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-investment-system"
version = "0.1.0"
description = "AI-powered investment research and analysis system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openbb>=4.7",
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "openai>=1.6",
    "anthropic>=0.18",
    "rich>=13.7",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
    "mypy>=1.8",
    "jupyter>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
